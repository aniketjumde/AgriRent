services:
  - type: web
    name: agrirent-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn agrirent.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "agrirent-api.onrender.com,localhost,127.0.0.1,.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://agrirent-frontend-sandy.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://agrirent-frontend-sandy.vercel.app,https://*.vercel.app,https://agrirent-api.onrender.com"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.resend.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: "resend"
      - key: DEFAULT_FROM_EMAIL
        value: "AgriRent <onboarding@resend.dev>"
      - key: FRONTEND_URL
        value: "https://agrirent-frontend-sandy.vercel.app"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
