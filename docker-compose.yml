version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: agrirent_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=agrirent
      - POSTGRES_USER=agrirent_user
      - POSTGRES_PASSWORD=agrirent_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrirent_user -d agrirent"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: agrirent_backend
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - DB_NAME=agrirent
      - DB_USER=agrirent_user
      - DB_PASSWORD=agrirent_pass
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_SECRET_KEY=local-dev-secret-key-change-in-production
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:80,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: agrirent_frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
