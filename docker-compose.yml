version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: agrirent_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=agrirent
      - POSTGRES_USER=agrirent_user
      - POSTGRES_PASSWORD=agrirent_pass
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrirent_user -d agrirent"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: agrirent_backend
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python seed.py &&
             gunicorn agrirent.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=False
      - DB_NAME=agrirent
      - DB_USER=agrirent_user
      - DB_PASSWORD=agrirent_pass
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_SECRET_KEY=production-secret-key-change-me-in-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: agrirent_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
